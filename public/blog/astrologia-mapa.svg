<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgAstro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a29"/>
      <stop offset="50%" stop-color="#140f38"/>
      <stop offset="100%" stop-color="#040314"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="glowAstro" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgAstro)"/>
  <circle cx="600" cy="315" r="380" fill="url(#glowAstro)"/>

  <!-- Starry Background -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="150" cy="80" r="1.5"/><circle cx="280" cy="140" r="2.2"/><circle cx="450" cy="90" r="1.2"/>
    <circle cx="750" cy="100" r="2"/><circle cx="920" cy="75" r="2.5"/><circle cx="1080" cy="120" r="1.5"/>
    <circle cx="180" cy="520" r="1.8"/><circle cx="320" cy="480" r="1.5"/><circle cx="890" cy="510" r="2.2"/>
    <circle cx="1040" cy="460" r="1.8"/>
  </g>

  <!-- Astrological Chart / Zodiac Wheel -->
  <g transform="translate(600, 305)" stroke="url(#gold)" fill="none">
    <!-- Outer Rims -->
    <circle r="225" stroke-width="4"/>
    <circle r="200" stroke-width="1.5"/>
    <circle r="160" stroke-width="1.2" stroke-dasharray="3,4"/>
    <circle r="90" stroke-width="1.5"/>
    <circle r="30" stroke-width="2" fill="#090a29"/>

    <!-- 12 Astrological Houses Dividing Rays -->
    <g stroke-width="1" opacity="0.6">
      <line x1="0" y1="-200" x2="0" y2="-90"/>
      <line x1="100" y1="-173.2" x2="45" y2="-77.9"/>
      <line x1="173.2" y1="-100" x2="77.9" y2="-45"/>
      <line x1="200" y1="0" x2="90" y2="0"/>
      <line x1="173.2" y1="100" x2="77.9" y2="45"/>
      <line x1="100" y1="173.2" x2="45" y2="77.9"/>
      <line x1="0" y1="200" x2="0" y2="90"/>
      <line x1="-100" y1="173.2" x2="-45" y2="77.9"/>
      <line x1="-173.2" y1="100" x2="-77.9" y2="45"/>
      <line x1="-200" y1="0" x2="-90" y2="0"/>
      <line x1="-173.2" y1="-100" x2="-77.9" y2="-45"/>
      <line x1="-100" y1="-173.2" x2="-45" y2="-77.9"/>
    </g>

    <!-- Planetary Aspects (Aspect Lines in Center) -->
    <g stroke="#38bdf8" stroke-width="1.2" opacity="0.5">
      <polygon points="0,-90 77.9,45 -77.9,45"/> <!-- Trine -->
      <line x1="0" y1="-90" x2="0" y2="90"/> <!-- Opposition -->
      <line x1="-90" y1="0" x2="90" y2="0"/>
    </g>

    <!-- Sun & Planets Symbols -->
    <circle cx="0" cy="0" r="6" fill="url(#gold)"/>
    <!-- Sun symbol in 10th house -->
    <circle cx="0" cy="-130" r="10" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="-130" r="2.5" fill="url(#gold)"/>
    <!-- Moon crescent in 1st house -->
    <path d="M-135,-30 A12,12 0 1,0 -135,-6 A8,8 0 1,1 -135,-30" fill="url(#gold)"/>
    <!-- Venus symbol -->
    <circle cx="125" cy="-45" r="7" stroke="url(#gold)" stroke-width="1.8"/>
    <line x1="125" y1="-38" x2="125" y2="-26" stroke="url(#gold)" stroke-width="1.8"/>
    <line x1="120" y1="-32" x2="130" y2="-32" stroke="url(#gold)" stroke-width="1.8"/>
    <!-- Jupiter symbol -->
    <text x="65" y="135" fill="#fef08a" font-family="serif" font-size="18" font-weight="bold">♃</text>
  </g>

  <text x="600" y="555" fill="#fef08a" font-family="serif" font-size="22" font-weight="300" text-anchor="middle" letter-spacing="4">MAPA ASTRAL, TRÂNSITOS &amp; PREVISÕES</text>
  <text x="600" y="590" fill="#d4af37" font-family="serif" font-size="16" font-weight="300" text-anchor="middle" letter-spacing="6">ORACULOS.TS • ASTROLOGIA &amp; CÉU</text>
</svg>
