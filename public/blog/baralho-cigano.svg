<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgCigano" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0815"/>
      <stop offset="50%" stop-color="#18040d"/>
      <stop offset="100%" stop-color="#090105"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <radialGradient id="glowCigano" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgCigano)"/>
  <circle cx="600" cy="315" r="380" fill="url(#glowCigano)"/>

  <!-- Floral Filigree & Golden Wheel -->
  <g stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.35" transform="translate(600, 315)">
    <!-- Romani Wheel 16 Spokes -->
    <circle r="230"/>
    <circle r="190" stroke-dasharray="6,6"/>
    <circle r="60"/>
    <g stroke-width="1">
      <line x1="-230" y1="0" x2="230" y2="0"/><line x1="0" y1="-230" x2="0" y2="230"/>
      <line x1="-162.6" y1="-162.6" x2="162.6" y2="162.6"/><line x1="-162.6" y1="162.6" x2="162.6" y2="-162.6"/>
    </g>
  </g>

  <!-- Lenormand Card 1 (O Trevo - Sorte) -->
  <g transform="translate(360, 315) rotate(-10)" filter="url(#shadow)">
    <rect x="-85" y="-135" width="170" height="270" rx="14" fill="#1c0a14" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="-75" y="-125" width="150" height="250" rx="10" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="-95" fill="#fef08a" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">2 • O TREVO</text>
    <!-- Four-Leaf Clover -->
    <g transform="translate(0, 0)" fill="url(#gold)" opacity="0.9">
      <circle cx="-16" cy="-16" r="15"/><circle cx="16" cy="-16" r="15"/>
      <circle cx="-16" cy="16" r="15"/><circle cx="16" cy="16" r="15"/>
      <path d="M0,0 Q10,40 18,55" fill="none" stroke="url(#gold)" stroke-width="3"/>
    </g>
    <text x="0" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">OPORTUNIDADES</text>
  </g>

  <!-- Lenormand Card 2 (O Coração - Amor) -->
  <g transform="translate(840, 315) rotate(10)" filter="url(#shadow)">
    <rect x="-85" y="-135" width="170" height="270" rx="14" fill="#1c0a14" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="-75" y="-125" width="150" height="250" rx="10" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="-95" fill="#fef08a" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">24 • O CORAÇÃO</text>
    <!-- Sacred Heart -->
    <path d="M0,25 C-45,-25 -45,-60 0,-40 C45,-60 45,-25 0,25 Z" fill="url(#crimson)" stroke="url(#gold)" stroke-width="2" transform="translate(0, 10)"/>
    <text x="0" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">AMOR &amp; AFETO</text>
  </g>

  <!-- Central Lenormand Card (A Chave - Resposta e Sucesso) -->
  <g transform="translate(600, 305)" filter="url(#shadow)">
    <rect x="-105" y="-165" width="210" height="330" rx="16" fill="#250d1a" stroke="url(#gold)" stroke-width="3"/>
    <rect x="-95" y="-155" width="190" height="310" rx="12" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="0" y="-125" fill="#fef08a" font-family="serif" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="3">33 • A CHAVE</text>
    <!-- Golden Antique Key -->
    <g transform="translate(0, -10)">
      <!-- Key Ring / Bow -->
      <circle cx="0" cy="-45" r="28" fill="none" stroke="url(#gold)" stroke-width="5"/>
      <circle cx="0" cy="-45" r="14" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
      <!-- Key Shaft -->
      <line x1="0" y1="-17" x2="0" y2="70" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      <!-- Key Bit -->
      <rect x="0" y="45" width="24" height="6" fill="url(#gold)"/>
      <rect x="0" y="60" width="18" height="6" fill="url(#gold)"/>
      <!-- Star sparks -->
      <polygon points="0,-45 4,-38 10,-45 4,-52" fill="#fff"/>
    </g>
    <text x="0" y="115" fill="#fef08a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">DESTINO DESBLOQUEADO</text>
    <text x="0" y="132" fill="#d4af37" font-family="sans-serif" font-size="9" text-anchor="middle">SOLUÇÕES &amp; CERTEZA</text>
  </g>

  <text x="600" y="580" fill="#d4af37" font-family="serif" font-size="18" font-weight="300" text-anchor="middle" letter-spacing="6">ORACULOS.TS • BARALHO CIGANO LENORMAND</text>
</svg>
