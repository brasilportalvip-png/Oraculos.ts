<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgBuzios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240f06"/>
      <stop offset="50%" stop-color="#180a04"/>
      <stop offset="100%" stop-color="#0a0301"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="shellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glowBuzios" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgBuzios)"/>
  <circle cx="600" cy="315" r="380" fill="url(#glowBuzios)"/>

  <!-- Sacred Opon Ifá Tray Circle -->
  <circle cx="600" cy="315" r="240" fill="#140602" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="600" cy="315" r="215" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- Four Cardinal Sacred Faces of Eshu / Orunmila on Tray Edge -->
  <circle cx="600" cy="85" r="14" fill="url(#gold)"/>
  <circle cx="600" cy="545" r="14" fill="url(#gold)"/>
  <circle cx="370" cy="315" r="14" fill="url(#gold)"/>
  <circle cx="830" cy="315" r="14" fill="url(#gold)"/>

  <!-- 16 Sacred Cowrie Shells (Búzios de Ifá) cast on the tray -->
  <!-- Shell 1 (Center Open) -->
  <g transform="translate(600, 270) rotate(15)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="26" ry="38" fill="url(#shellGradient)" stroke="#92400e" stroke-width="2"/>
    <path d="M-6,-24 Q-12,0 -4,24 M6,-24 Q12,0 4,24" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <line x1="-8" y1="-12" x2="8" y2="-12" stroke="#78350f" stroke-width="1.5"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#78350f" stroke-width="1.5"/>
    <line x1="-8" y1="12" x2="8" y2="12" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Shell 2 (Left) -->
  <g transform="translate(520, 320) rotate(-35)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="24" ry="35" fill="url(#shellGradient)" stroke="#92400e" stroke-width="2"/>
    <path d="M-5,-20 Q-10,0 -3,20 M5,-20 Q10,0 3,20" stroke="#78350f" stroke-width="2" fill="none"/>
  </g>

  <!-- Shell 3 (Right Open) -->
  <g transform="translate(680, 310) rotate(42)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="24" ry="36" fill="url(#shellGradient)" stroke="#92400e" stroke-width="2"/>
    <path d="M-5,-22 Q-11,0 -3,22 M5,-22 Q11,0 3,22" stroke="#78350f" stroke-width="2" fill="none"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Shell 4 (Bottom) -->
  <g transform="translate(580, 380) rotate(-10)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="25" ry="37" fill="url(#shellGradient)" stroke="#92400e" stroke-width="2"/>
    <path d="M-5,-22 Q-10,0 -3,22 M5,-22 Q10,0 3,22" stroke="#78350f" stroke-width="2" fill="none"/>
  </g>

  <!-- Shell 5 (Top Right) -->
  <g transform="translate(660, 220) rotate(-60)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="22" ry="32" fill="url(#shellGradient)" stroke="#92400e" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="14" ry="20" fill="#78350f" opacity="0.4"/>
  </g>

  <!-- Shell 6 (Top Left) -->
  <g transform="translate(510, 230) rotate(50)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="23" ry="33" fill="url(#shellGradient)" stroke="#92400e" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="15" ry="21" fill="#78350f" opacity="0.4"/>
  </g>

  <!-- Shell 7 (Bottom Right) -->
  <g transform="translate(670, 400) rotate(80)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="22" ry="33" fill="url(#shellGradient)" stroke="#92400e" stroke-width="2"/>
    <path d="M-5,-20 Q-10,0 -3,20 M5,-20 Q10,0 3,20" stroke="#78350f" stroke-width="2" fill="none"/>
  </g>

  <!-- Shell 8 (Bottom Left) -->
  <g transform="translate(480, 410) rotate(-75)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="21" ry="32" fill="url(#shellGradient)" stroke="#92400e" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="13" ry="19" fill="#78350f" opacity="0.4"/>
  </g>

  <!-- Odu Marks & Sacred Beads -->
  <circle cx="600" cy="315" r="12" fill="url(#gold)"/>
  <text x="600" y="525" fill="#fef08a" font-family="serif" font-size="22" font-weight="300" text-anchor="middle" letter-spacing="4">RESPOSTAS DOS ORIXÁS &amp; ODUS SAGRADOS</text>
  <text x="600" y="555" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="3">ORIENTAÇÃO ANCESTRAL &amp; CAMINHOS DE LUZ</text>
  <text x="600" y="590" fill="#d4af37" font-family="serif" font-size="16" font-weight="300" text-anchor="middle" letter-spacing="6">ORACULOS.TS • JOGO DE BÚZIOS</text>
</svg>
