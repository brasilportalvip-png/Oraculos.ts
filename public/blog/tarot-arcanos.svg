<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0718"/>
      <stop offset="50%" stop-color="#190d33"/>
      <stop offset="100%" stop-color="#07030e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="380" fill="url(#glow)"/>

  <!-- Stars & Constellations -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="90" r="1.5"/><circle cx="280" cy="160" r="2"/><circle cx="420" cy="70" r="1.2"/>
    <circle cx="780" cy="110" r="2.2"/><circle cx="940" cy="80" r="1.8"/><circle cx="1080" cy="140" r="1.5"/>
    <circle cx="150" cy="480" r="2"/><circle cx="240" cy="540" r="1.5"/><circle cx="980" cy="490" r="2.5"/>
    <circle cx="1060" cy="420" r="1.2"/><circle cx="600" cy="70" r="2"/>
  </g>

  <!-- Sacred Geometry Circular Mandala -->
  <g stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.4" transform="translate(600, 315)">
    <circle r="220" stroke-dasharray="4,6"/>
    <circle r="180"/>
    <polygon points="0,-180 155.88,90 -155.88,90"/>
    <polygon points="0,180 155.88,-90 -155.88,-90"/>
    <circle r="120" stroke-dasharray="2,4"/>
  </g>

  <!-- Central Tarot Cards Display -->
  <!-- Left Card (The High Priestess / A Sacerdotisa) -->
  <g transform="translate(420, 315) rotate(-12)" filter="url(#shadow)">
    <rect x="-90" y="-140" width="180" height="280" rx="14" fill="#150f26" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="-80" y="-130" width="160" height="260" rx="10" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Crescent Moon & Pillars -->
    <path d="M-40,-50 C-20,-50 -10,-30 -10,-10 C-10,10 -20,30 -40,30 C-25,20 -20,0 -40,-50" fill="url(#gold)" opacity="0.8"/>
    <rect x="-60" y="-90" width="8" height="180" fill="url(#gold)" opacity="0.6"/>
    <rect x="52" y="-90" width="8" height="180" fill="url(#gold)" opacity="0.6"/>
    <circle cx="0" cy="80" r="16" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="0" y="-105" fill="#fef08a" font-family="serif" font-size="12" text-anchor="middle" letter-spacing="3">II • SACERDOTISA</text>
  </g>

  <!-- Right Card (The Star / A Estrela) -->
  <g transform="translate(780, 315) rotate(12)" filter="url(#shadow)">
    <rect x="-90" y="-140" width="180" height="280" rx="14" fill="#150f26" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="-80" y="-130" width="160" height="260" rx="10" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Eight-pointed star -->
    <g transform="translate(0, -10)" fill="url(#gold)">
      <polygon points="0,-45 8,-12 40,-8 14,8 24,40 0,18 -24,40 -14,8 -40,-8 -8,-12"/>
      <circle cx="0" cy="0" r="6" fill="#fff"/>
    </g>
    <path d="M-40,60 Q0,85 40,60" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="-105" fill="#fef08a" font-family="serif" font-size="12" text-anchor="middle" letter-spacing="3">XVII • A ESTRELA</text>
  </g>

  <!-- Center Card (The Sun / O Sol - Focus) -->
  <g transform="translate(600, 305)" filter="url(#shadow)">
    <rect x="-105" y="-165" width="210" height="330" rx="16" fill="#1e1338" stroke="url(#gold)" stroke-width="3"/>
    <rect x="-95" y="-155" width="190" height="310" rx="12" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- Radiant Sun Face -->
    <circle cx="0" cy="-25" r="42" fill="url(#gold)"/>
    <circle cx="0" cy="-25" r="36" fill="#1e1338"/>
    <!-- Sun Rays -->
    <g stroke="url(#gold)" stroke-width="2.5" transform="translate(0, -25)">
      <line x1="0" y1="-58" x2="0" y2="-44"/>
      <line x1="41" y1="-41" x2="31" y2="-31"/>
      <line x1="58" y1="0" x2="44" y2="0"/>
      <line x1="41" y1="41" x2="31" y2="31"/>
      <line x1="0" y1="58" x2="0" y2="44"/>
      <line x1="-41" y1="41" x2="-31" y2="31"/>
      <line x1="-58" y1="0" x2="-44" y2="0"/>
      <line x1="-41" y1="-41" x2="-31" y2="-31"/>
    </g>
    <!-- Sun center dot -->
    <circle cx="0" cy="-25" r="14" fill="url(#gold)"/>
    <!-- Twin Child Sunflower Motif -->
    <path d="M-30,70 Q0,45 30,70" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="-130" fill="#fef08a" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="4">XIX • O SOL</text>
    <text x="0" y="125" fill="#d4af37" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">ILUMINAÇÃO &amp; VERDADE</text>
  </g>

  <!-- Header & Footer Accents -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8">
    <path d="M200,60 L450,60 M750,60 L1000,60"/>
    <circle cx="600" cy="60" r="4" fill="url(#gold)"/>
  </g>
  <text x="600" y="580" fill="#d4af37" font-family="serif" font-size="18" font-weight="300" text-anchor="middle" letter-spacing="6">ORACULOS.TS • PORTAL DO TAROT</text>
</svg>
