<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgDef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b081c"/>
      <stop offset="50%" stop-color="#180e30"/>
      <stop offset="100%" stop-color="#060410"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="glowDef" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgDef)"/>
  <circle cx="600" cy="315" r="380" fill="url(#glowDef)"/>

  <!-- Mystical Sacred Geometry Mandala -->
  <g transform="translate(600, 290)" stroke="url(#gold)" fill="none">
    <circle r="210" stroke-width="2.5"/>
    <circle r="170" stroke-width="1.2" stroke-dasharray="4,6"/>
    <circle r="130" stroke-width="1.8"/>
    <circle r="70" stroke-width="1.2"/>
    <circle r="18" fill="url(#gold)"/>

    <!-- Sacred Golden Star 12 points -->
    <polygon points="0,-130 33,-70 95,-95 70,-33 130,0 70,33 95,95 33,70 0,130 -33,70 -95,95 -70,33 -130,0 -70,-33 -95,-95 -33,-70" stroke-width="1.5" opacity="0.6"/>

    <!-- Crescent Moon Accent -->
    <path d="M-60,-170 C-30,-170 -10,-150 -10,-120 C-10,-90 -30,-70 -60,-70 C-40,-85 -35,-105 -60,-170" fill="url(#gold)" opacity="0.8"/>
    <path d="M60,-170 C30,-170 10,-150 10,-120 C10,-90 30,-70 60,-70 C40,-85 35,-105 60,-170" fill="url(#gold)" opacity="0.8"/>
  </g>

  <text x="600" y="535" fill="#fef08a" font-family="serif" font-size="24" font-weight="300" text-anchor="middle" letter-spacing="5">SABEDORIA ORACULAR &amp; ESPIRITUAL</text>
  <text x="600" y="565" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="3">CONECTE-SE COM SEU DESTINO &amp; PROPÓSITO</text>
  <text x="600" y="600" fill="#d4af37" font-family="serif" font-size="16" font-weight="300" text-anchor="middle" letter-spacing="6">ORACULOS.TS • PORTAL OFICIAL</text>
</svg>
