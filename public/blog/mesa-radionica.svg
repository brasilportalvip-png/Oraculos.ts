<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgMesa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="50%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#020814"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="cyanQuantum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glowMesa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgMesa)"/>
  <circle cx="600" cy="315" r="380" fill="url(#glowMesa)"/>

  <!-- Quantum Geometric Matrix / Flower of Life / Merkaba -->
  <g stroke="url(#cyanQuantum)" stroke-width="1.2" fill="none" opacity="0.35" transform="translate(600, 315)">
    <circle r="260"/>
    <circle r="210" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4,6"/>
    <circle r="140"/>
    <circle r="70"/>
    <!-- Overlapping Circles (Seed of Life) -->
    <circle cx="0" cy="-70" r="70"/>
    <circle cx="60.6" cy="-35" r="70"/>
    <circle cx="60.6" cy="35" r="70"/>
    <circle cx="0" cy="70" r="70"/>
    <circle cx="-60.6" cy="35" r="70"/>
    <circle cx="-60.6" cy="-35" r="70"/>
  </g>

  <!-- Biometer Scale Arc (Régua de Bovis) -->
  <path d="M350,380 A260,260 0 0,1 850,380" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Frequency ticks -->
  <g stroke="url(#gold)" stroke-width="1.5" opacity="0.7">
    <line x1="400" y1="350" x2="415" y2="340"/><line x1="460" y1="310" x2="475" y2="300"/>
    <line x1="530" y1="285" x2="540" y2="270"/><line x1="600" y1="270" x2="600" y2="255"/>
    <line x1="670" y1="285" x2="660" y2="270"/><line x1="740" y1="310" x2="725" y2="300"/>
    <line x1="800" y1="350" x2="785" y2="340"/>
  </g>

  <!-- Suspended Crystal Pendulum -->
  <g transform="translate(600, 110)">
    <!-- Chain -->
    <line x1="0" y1="0" x2="0" y2="170" stroke="url(#gold)" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="8" fill="url(#gold)"/>
    <!-- Faceted Pendulum Body -->
    <polygon points="0,265 -28,175 0,160 28,175" fill="url(#cyanQuantum)" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="0,265 -12,175 0,160 12,175" fill="#e0f2fe" opacity="0.8"/>
    <!-- Crystal Radiance Glow -->
    <circle cx="0" cy="215" r="45" fill="#38bdf8" opacity="0.25"/>
    <circle cx="0" cy="265" r="4" fill="#ffffff"/>
  </g>

  <!-- Energy Pulse Wave at Tip -->
  <circle cx="600" cy="375" r="25" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <circle cx="600" cy="375" r="50" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="600" cy="375" r="80" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Texts & Branding -->
  <text x="600" y="520" fill="#fef08a" font-family="serif" font-size="22" font-weight="300" text-anchor="middle" letter-spacing="4">ALINHAMENTO QUÂNTICO &amp; HARMONIZAÇÃO</text>
  <text x="600" y="550" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3">TRANSMUTAÇÃO DE FREQUÊNCIAS E CHAKRAS</text>
  <text x="600" y="590" fill="#d4af37" font-family="serif" font-size="16" font-weight="300" text-anchor="middle" letter-spacing="6">ORACULOS.TS • MESA RADIÔNICA</text>
</svg>
