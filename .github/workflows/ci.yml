name: CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Production Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        node-version:
          - 22.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Firestore security rules
        run: >
          npx firebase-tools@15.28.1
          emulators:exec
          --only firestore
          --project demo-oraculos
          "npx vitest run test/firestore-rules.test.ts"

      - name: Validate official binary assets
        run: npm run validate:assets

      - name: Run TypeScript lint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build production project
        run: npm run build

      - name: Verify backend is not publicly exposed
        shell: bash
        run: |
          test ! -f dist/public/server.cjs
          test ! -f dist/public/server.cjs.map
          test ! -f dist/public/serverless.cjs
          test -f dist/server.cjs
          test -f dist/server.cjs.map
          test -f dist/serverless.cjs
          echo "Backend bundle correctly isolated from public output."

      - name: Smoke test serverless bundle
        run: npm run smoke:serverless

      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
