name: CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Production Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        node-version:
          - 22.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate official binary assets
        run: npm run validate:assets

      - name: Run TypeScript lint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build production project
        run: npm run build

      - name: Verify backend is not publicly exposed
        shell: bash
        run: |
          test ! -f dist/public/server.cjs
          test ! -f dist/public/server.cjs.map
          test -f dist/server.cjs
          test -f dist/server.cjs.map
          echo "Backend bundle correctly isolated from public output."

      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high